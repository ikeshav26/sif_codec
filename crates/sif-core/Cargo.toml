[package]
name = "sif-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Authenticated Encryption (AEAD)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# NIST Key Wrapping (KEK wraps DEK)
aes-kw = "0.2"

# Asymmetric Digital Signatures
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Cryptographic Randomness & Hashing
rand = "0.8"
sha2 = "0.10"
